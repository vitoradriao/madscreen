[package]
name = "madscreen-app"
version = "0.1.26"
edition = "2024"
rust-version = "1.85"
description = "madscreen: compartilhamento de tela de baixa latencia"
license = "GPL-3.0-or-later"
publish = false
default-run = "madscreen-app"

[features]
diagnostic-lab = []

[[bin]]
name = "diagnostic-lab"
path = "src/bin/diagnostic-lab.rs"
required-features = ["diagnostic-lab"]

[[bin]]
name = "popout-lab"
path = "src/bin/popout-lab.rs"
required-features = ["diagnostic-lab"]

# Workspace proprio: o app precisa do frontend buildado (frontendDist) e das libs do WebView,
# entao fica fora do `cargo ... --workspace` da raiz e tem CI dedicado (app.yml).
[workspace]

[lib]
name = "madscreen_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.4.10"
madscreen-ipc = { path = "../../../crates/madscreen-ipc" }
madscreen-audio = { path = "../../../crates/madscreen-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
semver = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Accessibility"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
