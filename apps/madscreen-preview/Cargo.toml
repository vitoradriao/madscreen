[package]
name = "madscreen-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
madscreen-capture = { path = "../../crates/madscreen-capture" }

[target.'cfg(windows)'.dependencies]
windows-future = "0.3.2"
windows = { workspace = true, features = [
    "Foundation", "Graphics_Capture", "Win32_Foundation",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
