name: Worker e viewer web

on:
  push:
    branches: [main]
    paths:
      - "tools/cloudflare/worker/**"
      - "viewer/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "tools/cloudflare/worker/**"
      - "viewer/**"
      - ".github/workflows/worker.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/cloudflare/worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../../../viewer
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm test --prefix ../../../viewer
