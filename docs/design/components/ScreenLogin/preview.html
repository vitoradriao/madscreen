<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ScreenLogin</title><style>html,body{height:100%;overflow:hidden}body{padding:0}.login{height:800px;width:1280px;display:flex;flex-direction:column}.lb{display:flex;align-items:center;gap:8px;height:64px;padding:0 var(--sp-6);font-size:var(--fs-lg);font-weight:600}.lbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--sp-7);align-items:center;width:1000px;margin:0 auto;padding-bottom:var(--sp-7)}.disp{font-size:var(--fs-display);line-height:1.08;letter-spacing:-0.03em}.lead{color:var(--text-2);font-size:var(--fs-lg);margin-top:var(--sp-3)}.auth{display:grid;gap:var(--sp-4);padding:28px}</style></head>
<body>
<div class="login"><header class="lb"><span class="rail-brand" style="margin:0">m.</span>madscreen</header><main class="lbody"><div><h1 class="disp">Entrar no madscreen</h1><p class="lead">Acesse seus servidores e transmissões.</p></div>
<section class="card auth" aria-labelledby="ac"><h2 id="ac">Acessar conta</h2><div class="field"><label for="inv">Tenho um convite (código ou link)</label><input id="inv" class="input" placeholder="XXXX-XXXX ou link do convite"><span class="hint">Cole o convite para conferir em qual servidor você vai entrar.</span></div><button class="btn primary lg block"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg>Continuar com Discord</button><button class="btn ghost block" style="justify-content:flex-start"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>Entrar sem Discord</button><p class="faint" style="font-size:var(--fs-sm)">O Discord abre no seu navegador. Depois, volte ao app.</p></section></main></div>

</body>
</html>
