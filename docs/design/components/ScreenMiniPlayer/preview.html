<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ScreenMiniPlayer</title><style>html,body{height:100%;overflow:hidden}body{padding:0}.desk{display:flex;gap:40px;padding:30px;width:1280px;height:420px;background:var(--surface-4)}.col{display:grid;gap:12px;align-content:start}.col>span{font-size:var(--fs-sm);color:var(--text-2);max-width:560px}.desk .miniwin{width:560px;height:315px}</style></head>
<body>
<div class="desk"><div class="col"><div class="miniwin" aria-label="Mini-player"><div class="stage show"><svg class="frame" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="#2a2a2a"/><path d="M0 62 30 44 52 55 84 30 116 50 160 26V90H0Z" fill="#3a3a3a"/><path d="M0 74 40 60 70 70 110 54 160 66V90H0Z" fill="#1c1c1c"/><circle cx="124" cy="20" r="8" fill="#5a5a5a"/></svg><div class="player-top drag"><div class="who"><b>Bruno</b><span class="badge live">Ao vivo</span></div><button class="btn ghost sm on" aria-pressed="true"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v4M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6Z"/></svg>Fixado</button><button class="btn ghost sm"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Controles</button><button class="btn ghost sm"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar</button></div><div class="player-bar"><button class="btn ghost icon-only" aria-label="Silenciar (M)"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><div class="vol" aria-label="Volume"><div class="track"><span style="width:70%"></span></div></div><span class="spacer"></span></div></div></div><span>Com o mouse em cima: arrastar pela barra, Fixar (sempre no topo), Controles, Voltar ao app.</span></div><div class="col"><div class="miniwin" aria-label="Mini-player"><div class="stage"><svg class="frame" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="#2a2a2a"/><path d="M0 62 30 44 52 55 84 30 116 50 160 26V90H0Z" fill="#3a3a3a"/><path d="M0 74 40 60 70 70 110 54 160 66V90H0Z" fill="#1c1c1c"/><circle cx="124" cy="20" r="8" fill="#5a5a5a"/></svg><div class="player-top drag"><div class="who"><b>Bruno</b><span class="badge live">Ao vivo</span></div><button class="btn ghost sm on" aria-pressed="true"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v4M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6Z"/></svg>Fixado</button><button class="btn ghost sm"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Controles</button><button class="btn ghost sm"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar</button></div><div class="player-bar"><button class="btn ghost icon-only" aria-label="Silenciar (M)"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><div class="vol" aria-label="Volume"><div class="track"><span style="width:70%"></span></div></div><span class="spacer"></span></div></div></div><span>Parado: só o vídeo, sem moldura.</span></div></div>
<script>document.querySelectorAll(".stage,.tile,.miniwin").forEach(function(s){if(document.documentElement.getAttribute("data-theme")==="light")s.setAttribute("data-theme","dark");});</script>
</body>
</html>
