<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ScreenNoServer</title><style>html,body{height:100%;overflow:hidden}body{padding:0}.app{display:grid;height:800px;width:1280px;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--members-w)}.app>.rail,.app>.members,.app>.help{height:800px}.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}.content{flex:1;overflow:hidden;padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-5)}.content>.stage{flex:1;min-height:0;aspect-ratio:auto}.keys{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--text-3)}.keys .sep{margin:0 var(--sp-1)}.app{position:relative}</style></head>

<div class="app" style="grid-template-columns:var(--rail-w) minmax(0,1fr)"><nav class="rail" aria-label="Servidores"><span class="rail-brand">m.</span><button class="rail-add" aria-label="Adicionar servidor" aria-expanded="true">+</button><span class="rail-me"><span class="avatar ">AN<span class="status" aria-label="Online"></span></span></span></nav><div class="main"><header class="topbar"><span class="server" style="cursor:default">Seus servidores</span></header><div class="content" style="justify-content:center">
