[package]
name = "madscreen-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Performance",
] }

[dev-dependencies]
serde_json.workspace = true
anyhow.workspace = true

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
