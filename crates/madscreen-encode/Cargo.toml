[package]
name = "madscreen-encode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
madscreen-ipc = { path = "../madscreen-ipc" }
madscreen-telemetry = { path = "../madscreen-telemetry" }
madscreen-capture = { path = "../madscreen-capture" }
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_System_Performance",
    "Win32_System_Threading", "Win32_Security", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
