[package]
name = "madscreen-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-future = "0.3.2"
windows = { workspace = true, features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess", "Win32_Foundation",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Gdi", "Win32_System_Performance",
    "Win32_Graphics_Direct3D_Fxc", "Wdk_System_SystemServices", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_Security",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
